server:
  port: 8080

spring:
  application:
    name: doomsday-backend

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # DataSource (PostgreSQL)
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:doomsday}
    username: ${PG_USER:doomsday}
    password: ${PG_PASSWORD:doomsday}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===== Spring AI Alibaba (DashScope) =====
  ai:
    dashscope:
      # 从环境变量注入；本地开发可在 .env 或 IDE Run Config 中设置 DASHSCOPE_API_KEY=sk-xxx
      api-key: ${DASHSCOPE_API_KEY:not-configured}
      chat:
        options:
          # 默认主力模型（PlotGenerationAgent / OptionGenerationAgent）
          # ⚠️ 待确认：可替换为 qwen3.6-plus 或 qwen-max
          model: qwen-plus
          temperature: 0.75
          max-tokens: 1024
      embedding:
        options:
          # 向量模型，text-embedding-v3 默认输出 1024 维，与 V1/V3/V4 migration schema 对齐
          model: text-embedding-v3

    # ===== PgVector Store (RAG) =====
    vectorstore:
      pgvector:
        # schema 由 Flyway V3 管理，关闭 Spring AI 自动建表
        initialize-schema: false
        schema-name: public
        table-name: vector_store
        # 必须与 V4 migration 修正后的 VECTOR(1024) 维度一致（text-embedding-v3 默认 1024 维）
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: IVFFLAT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

game:
  chaos:
    enabled: false
  diary:
    summary:
      every-turns: 3
      scheduler-enabled: true
      fixed-delay-ms: 60000
      sweep-limit: 50
  media:
    image:
      timeout-ms: 3000
      dashscope-model: wanx2.1-t2i-turbo
    pexels:
      api-key: ${PEXELS_API_KEY:not-configured}
      base-url: https://api.pexels.com/v1

